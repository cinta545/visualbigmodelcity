<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市交通 · 数字视界</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/src/city-home.css"></head><body>
<canvas id="scene" aria-label="城市真实交通三维视图"></canvas>
<header class="glass"><small>城市交通 · 数字视界</small><h1 id="city-name">天津</h1><div class="subtitle"><i class="dot"></i><span id="weather-note">真实记录循环回放 · 晴朗白天</span></div><nav id="cities" aria-label="城市切换"></nav></header>
<div class="actions glass"><button id="toggle-charts" aria-pressed="true">图表总览</button><button id="capture">保存画面</button><button id="fullscreen" aria-pressed="false" title="收起数据分析面板，再次点击恢复">全屏</button></div>
<aside id="traffic-charts" class="traffic-charts glass"><h2 class="panel-title">交通总览</h2><div class="donut-wrap"><svg id="vehicle-donut" viewBox="0 0 130 130" role="img" aria-label="当前车辆类型占比"></svg><div id="vehicle-legend"></div></div><p class="caption" style="margin:18px 0 -10px">机动车 · 即时状态</p><div id="vehicle-filter" hidden><span id="vehicle-filter-name"></span><button id="clear-vehicle-filter">显示全部</button></div><div class="motion-grid"><div><strong id="moving-count">—</strong><span>行驶中</span></div><div><strong id="slow-count">—</strong><span>静止 / 低速</span></div><div><strong id="mean-speed">—</strong><span>均速 · 千米/时</span></div></div><h2 class="panel-title chart-heading">通过量趋势</h2><svg id="flow-trend" viewBox="0 0 260 110" role="img" aria-label="近两分钟每十秒车辆通过量"></svg><div class="chart-axis"><span>近两分钟 · 每十秒</span><span>当前</span></div><button id="dim-static" aria-pressed="false" title="只改变显示，全部观测仍参与统计与风险分析">淡化静止车辆</button><button id="parked-visibility" hidden aria-pressed="false" title="仅影响三维显示，统计和风险分析保留全部记录">显示长期静止车辆</button><button id="focus-moving">跟随行驶车辆</button><p class="caption" id="motion-note"></p></aside><aside id="flow-panel" class="flow glass"><h2 class="panel-title">路口车流</h2><div class="caption">最近六十秒通过量</div><strong class="big" id="flow-recent">—</strong><span class="caption"> 辆</span><p id="flow-total">本轮累计 — 辆</p><div id="approaches"></div><section class="risk-summary"><h2 class="panel-title">风险概览 <span class="caption">未来三秒</span></h2><div id="risk-bars"></div><div id="risk-candidates"></div><div id="risk-inspection" hidden><p id="risk-inspection-text"></p><button id="clear-risk">取消风险定位</button></div><span class="caption">运动学候选 · 待核验</span></section><section class="signals"><div class="caption">信号实况</div><div id="signals"></div></section></aside>
<aside id="object" class="object glass" hidden><div class="caption">交通参与者</div><h2 id="object-title"></h2><p id="object-info"></p><section class="prediction-details"><h3>未来三秒轨迹</h3><label>预测模型 <select id="home-prediction-model"><option value="cv">恒速</option><option value="ca">恒加速度</option><option value="dca">衰减加速度</option><option value="ctrv">恒速转弯</option></select></label><svg id="prediction-chart" viewBox="0 0 280 130" role="img" aria-label="车辆过去轨迹与未来预测"></svg><p id="prediction-detail"></p><p class="caption">金色为历史 · 青色为预测</p></section><button id="follow">跟随观察</button><button id="dismiss">关闭</button></aside>
<div class="tools glass"><button id="play">暂停</button><button id="flow-layer" aria-pressed="false">进口标识</button><button id="reset">回到总览</button></div>
<p class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 点击车辆查看</p>
<nav class="view-dock glass" aria-label="场景视角"><button data-view="sample"><img alt="街角样板实景预览"><span>街角样板</span></button><button data-view="overview" class="active"><img alt="街区总览实景预览"><span>街区总览</span></button><button data-view="junction"><img alt="路口近景实景预览"><span>路口近景</span></button><button data-view="overhead"><img alt="地图俯视实景预览"><span>地图俯视</span></button><button data-view="street"><img alt="人行道近景实景预览"><span>人行道近景</span></button></nav>
<span class="credit" title="道路与轨迹来自公开采集记录，周边建筑为展示设计">真实轨迹 · 边界淡出</span><div id="loading" class="glass" role="status">正在构建城市视图…</div>
<script type="module" src="/src/city-home.mjs"></script></body></html>
