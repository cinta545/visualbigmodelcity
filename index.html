<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市交通 · 数字视界</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/src/city-home.css"></head><body>
<canvas id="scene" aria-label="城市真实交通三维视图"></canvas>
<header class="glass"><small>城市交通 · 数字视界</small><h1 id="city-name">天津</h1><div class="subtitle"><i class="dot"></i><span id="weather-note">晴朗白天</span></div><nav id="cities" aria-label="城市切换"></nav></header>
<div class="actions glass"><button id="toggle-charts" aria-pressed="true">图表总览</button><button id="capture">保存画面</button><button id="fullscreen" aria-pressed="false" title="收起数据分析面板，再次点击恢复">全屏</button></div>
<aside id="traffic-charts" class="traffic-charts glass"><div class="panel-label">交通总览</div><div class="headline-stats"><div><strong id="stat-current">—</strong><span>当前车辆</span></div><div><strong id="stat-flow">—</strong><span>六十秒通过</span></div><div><strong id="stat-risk">—</strong><span>交通提醒</span></div></div><section class="composition"><h2 class="panel-title">交通结构 <span class="caption">当前观测</span></h2><div class="donut-wrap"><svg id="vehicle-donut" viewBox="0 0 130 130" role="img" aria-label="当前车辆类型占比"></svg><div id="vehicle-legend"></div></div><div id="vehicle-filter" hidden><span id="vehicle-filter-name"></span><button id="clear-vehicle-filter">显示全部</button></div></section><section class="direction-section"><h2 class="panel-title">进口方向通过量 <span class="caption">近六十秒 · 辆</span></h2><div id="direction-chart"></div><p id="flow-total" class="caption"></p></section><section class="case-panel"><h2 class="panel-title">重点关注</h2><div class="case-filters"><button data-case-kind="cross" aria-pressed="true">车辆交汇</button><button data-case-kind="rear" aria-pressed="false">跟车过近</button></div><svg id="case-timeline" viewBox="0 0 260 65" role="img" aria-label="整段记录的风险案例分布"></svg><p id="case-count" class="caption"></p><div id="case-list"></div><div id="case-review" hidden><p id="case-status"></p><div class="case-actions"><button id="case-anchor">事件时刻</button><button id="case-play">播放后续</button><button id="case-end">五秒后</button></div><button id="case-exit">退出案例</button></div></section><section class="signals"><h2 class="panel-title">路口信号 <span class="caption">实况</span></h2><div id="signals"></div></section><div hidden><div id="motion-chart"></div><div id="moving-count"></div><div id="slow-count"></div><div id="mean-speed"></div><div id="motion-note"></div><svg id="flow-trend"></svg><svg id="flow-summary-chart"></svg><div id="flow-recent"></div><div id="approaches"></div><button id="parked-visibility"></button><button id="focus-moving"></button></div></aside><aside id="flow-panel" class="flow glass"><div class="panel-label">路口分析</div><section class="relations"><h2 class="panel-title">路口流量 <span class="caption">近六十秒 · 辆</span></h2><div id="traffic-tree"></div><div id="tree-tabs" class="tree-tabs"></div><p class="caption">选择方向，点亮对应树枝</p></section><section class="risk-summary"><h2 class="panel-title">交通提醒 <span class="caption">未来三秒</span></h2><div id="risk-bars"></div><div id="risk-candidates"></div><div id="risk-inspection" hidden><p id="risk-inspection-text"></p><button id="clear-risk">取消风险定位</button></div></section><section id="object" class="object" hidden><div class="caption">交通参与者</div><h2 id="object-title"></h2><p id="object-info"></p><section class="prediction-details" data-prediction-method="stdg-lstm"><h3>车辆预测</h3><svg id="prediction-chart" viewBox="0 0 280 130" role="img" aria-label="车辆过去轨迹与未来预测"></svg><p id="prediction-detail"></p><div id="prediction-error-chart" hidden></div><p class="caption" id="prediction-legend">灰蓝为历史 · 青色为预测</p></section><button id="follow">跟随观察</button><button id="dismiss">关闭</button></section>
</aside>
<div class="tools glass"><button id="play">暂停</button><button id="flow-layer" aria-pressed="false">进口标识</button><button id="reset">回到总览</button></div>

<nav class="view-dock glass" aria-label="场景视角"><button data-view="sample"><img alt="街角样板实景预览"><span>街角样板</span></button><button data-view="overview" class="active"><img alt="街区总览实景预览"><span>街区总览</span></button><button data-view="junction"><img alt="路口近景实景预览"><span>路口近景</span></button><button data-view="overhead"><img alt="地图俯视实景预览"><span>地图俯视</span></button><button data-view="street"><img alt="人行道近景实景预览"><span>人行道近景</span></button></nav>
<div id="loading" class="glass" role="status">正在构建城市视图…</div>
<script type="module" src="/src/city-home.mjs"></script></body></html>
