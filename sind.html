<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SinD 真实交通回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c25;color:#e7eef2;font:15px system-ui}header{padding:18px 26px;border-bottom:1px solid #34434e;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0 0 5px}a{color:#8edaca}small{color:#a9bac7}main{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 175px);min-height:360px}canvas{width:100%;height:100%;min-width:0}aside{padding:20px;border-left:1px solid #34434e;overflow:auto}#signals{display:grid;grid-template-columns:1fr 1fr;gap:10px}.signal{padding:9px;background:#1c2d39;border-radius:7px}.signal i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}p{line-height:1.65}footer{padding:17px 26px;display:flex;gap:15px;align-items:center}input{flex:1;min-width:90px}button,select{background:#263d4c;border:1px solid #527083;color:white;padding:9px 14px;border-radius:6px}#status{color:#96d9ca}#error{color:#ffa8a8}label{white-space:nowrap}@media(max-width:800px){main{grid-template-columns:1fr 230px}footer{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>天津路口 · SinD 真实交通回放</h1><small>历史观测数据 / 米制等比例地图 / 数据接入验证阶段</small></div><a href="/" target="_top">返回三维首页</a></header>
<main><canvas id="map" aria-label="车辆与行人在真实车道地图上的轨迹回放"></canvas><aside><div id="status">正在加载校验后的样例…</div><p id="error" role="alert"></p><h3>信号灯记录</h3><div id="signals"></div><p><small>编号沿用数据源 X1–X8；当前仅显示灯色时序，灯组与三维灯杆的绑定待核验。</small></p><h3>交通参与者</h3><p>蓝色：机动车<br>橙色：两轮车 / 三轮车<br>绿色：行人</p><label><input type="checkbox" id="trails" checked> 显示过去 3 秒轨迹</label><p id="details"></p><small>本页不生成车辆，不强制车辆服从灯色，不使用未来真实轨迹充当预测结果。</small></aside></main>
<footer><button id="play" disabled>播放</button><input id="time" aria-label="回放时间" type="range" min="0" max="1" step="10" value="0" disabled><output id="clock">0.0 s</output><select id="speed" aria-label="回放倍速"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></footer>
<script type="module" src="/src/sind-replay.mjs"></script></body></html>
